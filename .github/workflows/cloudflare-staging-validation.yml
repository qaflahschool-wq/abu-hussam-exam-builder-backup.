name: Cloudflare staging baseline

on:
  push:
    branches:
      - cloudflare/staging-foundation-2026-11-20
  pull_request:
    branches:
      - cloudflare/staging-foundation-2026-11-20
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: TypeScript validation
        run: npm run lint

      - name: Unit and image validation tests
        run: npm test

      - name: Production bundle build
        run: npm run build
