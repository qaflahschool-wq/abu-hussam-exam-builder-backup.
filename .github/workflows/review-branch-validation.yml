name: Review branch validation

on:
  push:
    branches:
      - review/extracted-source-2026-11-20
    paths-ignore:
      - server.js
      - dist/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: review-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: review/extracted-source-2026-11-20

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies without lifecycle scripts
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: TypeScript validation
        run: npm run lint

      - name: Production build validation
        run: npm run build

      - name: Update generated server bundle on review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js
          if git diff --cached --quiet; then
            echo "Generated server bundle is already current."
          else
            git commit -m "Rebuild server bundle after review fixes"
            git push origin HEAD:review/extracted-source-2026-11-20
          fi
