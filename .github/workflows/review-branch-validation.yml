name: Review branch validation

on:
  push:
    branches:
      - review/extracted-source-2026-11-20
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: review-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: review/extracted-source-2026-11-20

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies without lifecycle scripts
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: TypeScript validation
        run: npm run lint

      - name: Production build validation
        run: npm run build
